[package]
name = "amora"
authors = ["Erlangga Yudi Pradana"]
version = "0.1.0"
edition = "2024"

[profile.release]
panic = "abort"
lto = true
strip = true
opt-level = 3
codegen-units = 1

[dependencies]
axum = "0.8.9"
futures-util = "0.3.33"
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "signal"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
tokio-util = "0.7.18"
tower-http = { version = "0.7.0", features = ["cors"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
